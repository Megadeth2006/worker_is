<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Worker IS - Вариант 4089</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="card shadow-sm p-4">
        <h1 class="h3 mb-3">Информационная система управления объектами Worker</h1>
        <p class="text-muted">Вариант: 4089 | Сервер: WildFly 21.0.0.Final | СУБД: PostgreSQL</p>
        <hr>
        <div id="status" class="alert alert-secondary">Проверка подключения к серверу</div>
        <button class="btn btn-primary" onclick="checkStatus()">Проверить статус API и БД</button>
    </div>
</div>
<script>
    async function checkStatus() {
        const statusDiv = document.getElementById('status');
        statusDiv.className = 'alert alert-info';
        statusDiv.innerText = 'Запрос к /api/ping...';
        try {
            const res = await fetch('api/ping');
            const data = await res.json();
            if (data.dbConnected) {
                statusDiv.className = 'alert alert-success';
                statusDiv.innerHTML = `<strong>Всё работает!</strong><br>БД доступна, время БД: ${data.dbTime}`;
            } else {
                statusDiv.className = 'alert alert-warning';
                statusDiv.innerHTML = `<strong>API работает, но ошибка БД:</strong> ${data.dbError}`;
            }
        } catch (err) {
            statusDiv.className = 'alert alert-danger';
            statusDiv.innerText = 'Ошибка подключения к API: ' + err.message;
        }
    }
    checkStatus();
</script>
</body>
</html>
